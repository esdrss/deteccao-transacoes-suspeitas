<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise de Transações</title>

<style>
body{
    background:#003336;
    font-family: Arial, Helvetica, sans-serif;
    padding:40px;
    color:white;
}
.container{
    max-width:1100px;
    margin:auto;
}
h1{text-align:center;}
.actions{
    text-align:center;
    margin:20px 0;
}
button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
.btn{
    background:#0f766e;
    color:white;
}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:30px;
}
.card{
    background:white;
    color:#1f2937;
    padding:20px;
    border-radius:12px;
}
.card h3{
    font-size:14px;
    margin-bottom:8px;
}
.card .value{
    font-size:22px;
    font-weight:bold;
}
.alert{
    color:#dc2626;
}
.table-box{
    margin-top:40px;
    background:white;
    border-radius:12px;
    overflow:hidden;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    color:#1f2937;
}
th{
    background:#f3f4f6;
    font-size:12px;
    text-transform:uppercase;
}
.status{
    background:#fee2e2;
    color:#991b1b;
    padding:4px 8px;
    border-radius:999px;
    font-size:11px;
    font-weight:bold;
}
.erro{
    background:#7f1d1d;
    padding:10px;
    margin-top:20px;
    border-radius:8px;
    display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>Análise de Transações</h1>
<p style="text-align:center;">Regra dos 3 Sigma</p>

<div class="actions">
<input type="file" id="arquivo" accept=".xlsx,.xls,.csv">
<button class="btn" id="btnEnviar">Analisar planilha</button>
</div>

<div class="erro" id="erroBox"></div>

<div class="cards">
<div class="card">
<h3>MÉDIA</h3>
<div class="value">R$ <span id="media">--</span></div>
</div>

<div class="card">
<h3>DESVIO PADRÃO</h3>
<div class="value">R$ <span id="desvio">--</span></div>
</div>

<div class="card">
<h3>LIMITE (MÉDIA + 3σ)</h3>
<div class="value">R$ <span id="limite">--</span></div>
</div>

<div class="card">
<h3>QTD. SUSPEITAS</h3>
<div class="value alert"><span id="qtd">--</span></div>
</div>
</div>

<div class="table-box">
<table>
<thead>
<tr>
<th>ID</th>
<th>Data</th>
<th>Cliente</th>
<th>Valor</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>
const API_URL = "http://127.0.0.1:8000/analisar";

function formatarNumero(v){
    return Number(v).toLocaleString("pt-BR", {minimumFractionDigits:2});
}
function formatarDinheiro(v){
    return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

async function enviarArquivo(){
    const input = document.getElementById("arquivo");
    const erroBox = document.getElementById("erroBox");
    erroBox.style.display="none";

    if(!input.files.length){
        alert("Escolha uma planilha.");
        return;
    }

    const formData = new FormData();
    formData.append("arquivo", input.files[0]);

    try{
        const response = await fetch(API_URL,{
            method:"POST",
            body:formData
        });

        const dados = await response.json();

        if(dados.erro){
            erroBox.innerText=dados.erro;
            erroBox.style.display="block";
            return;
        }

        document.getElementById("media").textContent = formatarNumero(dados.media);
        document.getElementById("desvio").textContent = formatarNumero(dados.desvio_padrao);
        document.getElementById("limite").textContent = formatarNumero(dados.limite);
        document.getElementById("qtd").textContent = dados.quantidade_suspeitas;

        const tbody = document.getElementById("tbody");
        tbody.innerHTML="";

        if(dados.suspeitas.length===0){
            tbody.innerHTML="<tr><td colspan='5'>Nenhuma suspeita encontrada.</td></tr>";
            return;
        }

        dados.suspeitas.forEach((t,i)=>{
            const id = t.id || t.ID || `TRX-${9000+i}`;
            const data = t.data || "--";
            const cliente = t.cliente || "--";
            const valor = t.valor || 0;

            const tr = document.createElement("tr");
            tr.innerHTML=`
                <td>${id}</td>
                <td>${data}</td>
                <td>${cliente}</td>
                <td>${formatarDinheiro(valor)}</td>
                <td><span class="status">Suspeita</span></td>
            `;
            tbody.appendChild(tr);
        });

    }catch(error){
        erroBox.innerText="Erro ao conectar com a API. Certifique-se que o Python está rodando.";
        erroBox.style.display="block";
    }
}

document.getElementById("btnEnviar").addEventListener("click", enviarArquivo);
</script>

</body>
</html>
